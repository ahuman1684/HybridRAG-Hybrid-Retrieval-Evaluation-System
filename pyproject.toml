[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybridrag"
version = "0.1.0"
description = "Hybrid (dense + sparse) RAG system with a rigorous evaluation and ablation harness."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<2.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "anthropic>=0.40.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hybridrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
